</b><p style="MARGIN-BOTTOM: 0pt; TEXT-ALIGN: center; MARGIN-TOP: 18pt; LINE-HEIGHT: 1.7999"><span style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 700; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent">Рабочий стол.</span></p><br><p style="MARGIN-BOTTOM: 0pt; TEXT-ALIGN: justify; MARGIN-LEFT: 0.307pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.38" dir="ltr"><span style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent">Работа по боевым планам выполняется при помощи рабочего стола сотрудника. Открыть его можно через меню </span><span style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 700; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent">Рабочий стол</span></p>

<p style="MARGIN-BOTTOM: 0pt; TEXT-ALIGN: justify; MARGIN-LEFT: 0.307pt; MARGIN-TOP: 0pt; LINE-HEIGHT: 1.2" dir="ltr"><span style="FONT-SIZE: 11pt; TEXT-DECORATION: none; FONT-FAMILY: Arial; FONT-VARIANT: normal; VERTICAL-ALIGN: baseline; WHITE-SPACE: pre-wrap; FONT-WEIGHT: 400; COLOR: #000000; FONT-STYLE: normal; BACKGROUND-COLOR: transparent">На рабочем столе, выделяйте интересующий вас план и делайте отмети о выполнении конкретных задач.</span></p>
